<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThermoLink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0d10'/%3E%3Ccircle cx='8' cy='10' r='3' fill='%23ff9f1a'/%3E%3Crect x='6.9' y='2.5' width='2.2' height='6.5' rx='1.1' fill='%23ff9f1a'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0d10;color:#e6e8eb;
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;
         border-bottom:1px solid #1e242c;position:sticky;top:0;background:#0b0d10cc;
         backdrop-filter:blur(6px);z-index:10}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:#e5484d;transition:.2s}
  .dot.on{background:#30a46c;box-shadow:0 0 8px #30a46c88}
  .src{color:#8b949e;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .spacer{margin-left:auto}
  main{max-width:1320px;margin:0 auto;padding:18px;display:grid;
       grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .viewer{position:relative;background:#000;border:1px solid #1e242c;border-radius:12px;
          overflow:hidden;aspect-ratio:4/3}
  #feed{width:100%;height:100%;display:block;object-fit:fill;image-rendering:auto}
  .waiting{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
           background:#0b0d10;color:#8b949e;font-size:13px;text-align:center;padding:24px}
  .waiting.show{display:flex}
  .readout{position:absolute;left:12px;bottom:12px;display:flex;gap:16px;
           background:#080a0dcc;border:1px solid #2b3542;border-radius:9px;
           padding:8px 12px;font:12px ui-monospace,Menlo,monospace;backdrop-filter:blur(4px)}
  .readout div span{display:block;color:#8b949e;font-size:10px;letter-spacing:.08em}
  .readout b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .readout .max b{color:#ff9f1a}.readout .min b{color:#7fd1ff}
  #hot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;
       border-radius:50%;box-shadow:0 0 0 2px #000a;display:none;pointer-events:none}
  #hot::after{content:"HOT";position:absolute;left:16px;top:-6px;font:10px ui-monospace,Menlo,monospace;
              color:#fff;background:#080a0dd9;border:1px solid #4a5768;border-radius:4px;padding:1px 5px;white-space:nowrap}
  .badge{position:absolute;top:12px;left:12px;background:#080a0dcc;border:1px solid #2b3542;
         border-radius:999px;padding:4px 10px;font:11px ui-monospace,Menlo,monospace;color:#c8d1dc}
  aside{display:flex;flex-direction:column;gap:12px}
  .card{background:#12171e;border:1px solid #1e242c;border-radius:11px;padding:13px 14px}
  .card h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b949e;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,select,input{font:13px system-ui,sans-serif;color:#e6e8eb;background:#1a212a;
                      border:1px solid #2b3542;border-radius:7px;padding:6px 9px}
  button{cursor:pointer}
  button:hover{background:#232c37}
  button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .pals{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pals button{padding:7px 8px;font-size:12px}
  label.f{display:flex;align-items:center;gap:7px;color:#c8d1dc;font-size:12px;margin-top:9px}
  label.f input{width:88px;padding:5px 7px}
  label.f .hint{margin-left:auto;color:#5c6673;font-size:11px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;color:#c8d1dc}
  .kv span:nth-child(odd){color:#8b949e}
  .peaks{margin:8px 0 0;padding:0;list-style:none;font:12px ui-monospace,Menlo,monospace;color:#c8d1dc}
  .peaks li{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid #1b222b}
  .peaks li:first-child{border-top:0}
  .ok{color:#30a46c}.warn{color:#e5a83d}.err{color:#e5484d}
  a.btn{display:inline-block;text-decoration:none;background:#1a212a;border:1px solid #2b3542;
        border-radius:7px;padding:6px 10px;color:#e6e8eb;font-size:13px}
  a.btn:hover{background:#232c37}
  footer{max-width:1320px;margin:0 auto;padding:0 18px 22px;color:#5c6673;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>ThermoLink</h1>
  <div class="dot" id="dot" title="camera state"></div>
  <div class="src" id="source">connecting…</div>
  <div class="spacer"></div>
  <div class="src" id="unitLabel">°C</div>
  <button id="unit" title="toggle units">Switch to °F</button>
</header>

<main>
  <section class="viewer" id="viewer">
    <img id="feed" alt="thermal live view" src="/api/thermal.mjpg">
    <div class="badge" id="badge">waiting for frames</div>
    <div class="waiting show" id="waiting">No thermal frames yet.<br>Check the camera connection.</div>
    <div class="readout">
      <div class="min"><span>MIN</span><b id="tmin">–</b></div>
      <div><span>MEAN</span><b id="tmean">–</b></div>
      <div class="max"><span>MAX</span><b id="tmax">–</b></div>
    </div>
    <div id="hot"></div>
  </section>

  <aside>
    <div class="card">
      <h2>Palette</h2>
      <div class="pals" id="pals"></div>
    </div>

    <div class="card">
      <h2>Bands</h2>
      <label class="f">Clip low <input id="clipLo" type="number" step="0.5" placeholder="off"> <span class="hint">shown</span></label>
      <label class="f">Clip high <input id="clipHi" type="number" step="0.5" placeholder="off"> <span class="hint">shown</span></label>
      <label class="f">Span low <input id="spanLo" type="number" step="0.5" placeholder="auto"> <span class="hint">colour</span></label>
      <label class="f">Span high <input id="spanHi" type="number" step="0.5" placeholder="auto"> <span class="hint">colour</span></label>
      <div class="row" style="margin-top:11px">
        <button id="apply">Apply</button>
        <button id="reset">Reset</button>
      </div>
      <div class="src" id="bandState" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Hot spots</h2>
      <ul class="peaks" id="peaks"><li><span>—</span><span></span></li></ul>
    </div>

    <div class="card">
      <h2>Source</h2>
      <div class="kv">
        <span>Driver</span><span id="drv">–</span>
        <span>Model</span><span id="mdl">–</span>
        <span>Thermal</span><span id="res">–</span>
        <span>Frame</span><span id="seq">–</span>
        <span>Link</span><span id="link">–</span>
      </div>
      <div class="row" style="margin-top:11px">
        <a class="btn" id="snap" href="/api/thermal.jpg" download="thermolink.jpg">Save JPEG</a>
        <a class="btn" href="/api/spec" target="_blank" rel="noreferrer">Spec JSON</a>
      </div>
    </div>
  </aside>
</main>

<footer>ThermoLink · frames are rendered server-side from 16-bit radiometric data · <span id="foot">—</span></footer>

<script>
const $ = (id) => document.getElementById(id);
const state = { unit: "C", display: null, initialized: false, palettes: [] };

function fmt(c) {
  if (c === null || c === undefined || Number.isNaN(c)) return "–";
  const v = state.unit === "F" ? c * 9 / 5 + 32 : c;
  return v.toFixed(1) + "°" + state.unit;
}

function paintPalettes(list, current) {
  if (!list || !list.length) return;
  if (!state.palettes.length) {
    state.palettes = list;
    $("pals").innerHTML = "";
    for (const name of list) {
      const b = document.createElement("button");
      b.textContent = name;
      b.dataset.pal = name;
      b.onclick = () => setDisplay({ palette: name });
      $("pals").appendChild(b);
    }
  }
  for (const b of $("pals").children) b.classList.toggle("active", b.dataset.pal === current);
}

async function setDisplay(patch) {
  const next = Object.assign({}, state.display || {}, patch);
  const r = await fetch("/api/display", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(next)
  });
  if (r.ok) {
    state.display = await r.json();
    paintPalettes(state.palettes, state.display.palette);
    $("bandState").textContent = "applied";
    setTimeout(() => $("bandState").textContent = "", 1200);
  } else {
    $("bandState").textContent = "error: " + (await r.text());
  }
}

function numOrNull(id) {
  const v = $(id).value.trim();
  if (v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

$("apply").onclick = () => setDisplay({
  clip_lo: numOrNull("clipLo"), clip_hi: numOrNull("clipHi"),
  span_lo: numOrNull("spanLo"), span_hi: numOrNull("spanHi")
});

$("reset").onclick = () => {
  for (const id of ["clipLo", "clipHi", "spanLo", "spanHi"]) $(id).value = "";
  setDisplay({ clip_lo: null, clip_hi: null, span_lo: null, span_hi: null });
};

$("unit").onclick = () => {
  state.unit = state.unit === "C" ? "F" : "C";
  $("unitLabel").textContent = "°" + state.unit;
  $("unit").textContent = state.unit === "C" ? "Switch to °F" : "Switch to °C";
  poll();
};

function fillDisplay(d) {
  if (!d) return;
  state.display = d;
  paintPalettes(state.palettes, d.palette);
  const map = { clipLo: d.clip_lo, clipHi: d.clip_hi, spanLo: d.span_lo, spanHi: d.span_hi };
  for (const [id, val] of Object.entries(map)) {
    const el = $(id);
    if (document.activeElement !== el) el.value = val === null ? "" : val;
  }
}

async function poll() {
  try {
    const r = await fetch("/api/thermal.json", { cache: "no-store" });
    const d = await r.json();
    const connected = !!d.connected, ready = !!d.ready;
    $("dot").className = "dot" + (connected ? " on" : "");
    $("waiting").classList.toggle("show", !ready);
    $("badge").textContent = ready ? (connected ? "live" : "stale frame") : "waiting for frames";

    if (d.spec) {
      $("drv").textContent = d.spec.driver || "–";
      $("mdl").textContent = d.spec.model || "–";
      const t = d.spec.thermal;
      $("res").textContent = t ? `${t.width}×${t.height} · ${t.bit_depth}-bit` : "none";
      $("source").textContent = `${d.spec.driver} · ${d.spec.model || ""}`;
    }
    $("seq").textContent = d.seq ?? "–";
    $("link").innerHTML = connected ? '<span class="ok">connected</span>' : '<span class="err">offline</span>';
    if (d.palettes) paintPalettes(d.palettes, (d.display || {}).palette);
    if (d.display && !state.initialized) { fillDisplay(d.display); state.initialized = true; }

    if (!ready || !d.stats) return;
    const s = d.stats;
    $("tmin").textContent = fmt(s.min_c);
    $("tmean").textContent = fmt(s.mean_c);
    $("tmax").textContent = fmt(s.max_c);
    const hot = $("hot"), viewer = $("viewer");
    if (s.hot && s.w && s.h) {
      hot.style.display = "block";
      hot.style.left = (s.hot[0] / s.w * 100) + "%";
      hot.style.top = (s.hot[1] / s.h * 100) + "%";
    } else hot.style.display = "none";

    const peaks = d.peaks || [];
    $("peaks").innerHTML = peaks.length
      ? peaks.map((p, i) => `<li><span>#${i + 1} · ${p.x},${p.y}</span><span>${fmt(p.c)}</span></li>`).join("")
      : "<li><span>no hot spots</span><span></span></li>";

    if (!state.initialized) { fillDisplay(d.display); state.initialized = true; }
    $("foot").textContent = `seq ${d.seq} · ${s.w}×${s.h}`;
  } catch (e) {
    $("dot").className = "dot";
    $("link").innerHTML = '<span class="err">unreachable</span>';
  }
}

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
