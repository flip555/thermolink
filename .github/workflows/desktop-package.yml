name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-runtime
    paths:
      - .github/workflows/desktop-package.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - desktop/**

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch LGPL ffmpeg (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -L --fail -o /tmp/ffmpeg-lgpl.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xf /tmp/ffmpeg-lgpl.tar.xz -C /tmp
          mkdir -p desktop/src-tauri/resources
          cp /tmp/ffmpeg-master-latest-linux64-lgpl/bin/ffmpeg desktop/src-tauri/resources/ffmpeg
          cp /tmp/ffmpeg-master-latest-linux64-lgpl/LICENSE.txt desktop/src-tauri/resources/FFMPEG-LICENSE.txt
          desktop/src-tauri/resources/ffmpeg -version | head -1
      - name: Fetch LGPL ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg-lgpl.zip"
          curl.exe -L --fail -o $zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-lgpl" -Force
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/resources" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\ffmpeg-lgpl\ffmpeg-master-latest-win64-lgpl\bin\ffmpeg.exe" "desktop/src-tauri/resources/ffmpeg.exe"
          Copy-Item "$env:RUNNER_TEMP\ffmpeg-lgpl\ffmpeg-master-latest-win64-lgpl\LICENSE.txt" "desktop/src-tauri/resources/FFMPEG-LICENSE.txt"
          & "desktop/src-tauri/resources/ffmpeg.exe" -version | Select-Object -First 1
      - name: Build LGPL ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: ./desktop/build-lgpl-ffmpeg.sh
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - name: Install JS dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build package
        working-directory: desktop
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Upload Linux packages
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: thermolink-linux-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload Windows packages
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: thermolink-windows-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent target/${{ matrix.target }}/release/bundle/macos/ThermoLink.app thermolink-macos-${{ matrix.target }}.zip
      - name: Upload macOS app
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: thermolink-macos-${{ matrix.target }}
          path: thermolink-macos-${{ matrix.target }}.zip
          if-no-files-found: error
