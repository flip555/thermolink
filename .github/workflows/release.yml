name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package CLI
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/thermolink dist/
          cp README.md LICENSE dist/
          tar -C dist -czf thermolink-${{ matrix.target }}.tar.gz .
          sha256sum thermolink-${{ matrix.target }}.tar.gz > SHA256SUMS-${{ matrix.target }}.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            thermolink-${{ matrix.target }}.tar.gz
            SHA256SUMS-${{ matrix.target }}.txt

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - name: Fetch LGPL ffmpeg (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          curl -L --fail -o /tmp/ffmpeg-lgpl.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xf /tmp/ffmpeg-lgpl.tar.xz -C /tmp
          mkdir -p desktop/src-tauri/resources
          cp /tmp/ffmpeg-master-latest-linux64-lgpl/bin/ffmpeg desktop/src-tauri/resources/ffmpeg
          cp /tmp/ffmpeg-master-latest-linux64-lgpl/LICENSE.txt desktop/src-tauri/resources/FFMPEG-LICENSE.txt
      - name: Fetch LGPL ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg-lgpl.zip"
          curl.exe -L --fail -o $zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-lgpl" -Force
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/resources" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\ffmpeg-lgpl\ffmpeg-master-latest-win64-lgpl\bin\ffmpeg.exe" "desktop/src-tauri/resources/ffmpeg.exe"
          Copy-Item "$env:RUNNER_TEMP\ffmpeg-lgpl\ffmpeg-master-latest-win64-lgpl\LICENSE.txt" "desktop/src-tauri/resources/FFMPEG-LICENSE.txt"
      - name: Build LGPL ffmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: ./desktop/build-lgpl-ffmpeg.sh
      - name: Install JS dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build desktop bundles
        working-directory: desktop
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package Linux artifacts
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb release-assets/
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS-linux-${{ matrix.target }}.txt)
      - uses: softprops/action-gh-release@v3
        if: matrix.platform == 'ubuntu-24.04'
        with:
          files: release-assets/*
      - name: Package Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bundle/nsis/*.exe release-assets/
          Copy-Item target/${{ matrix.target }}/release/bundle/msi/*.msi release-assets/
          $files = Get-ChildItem release-assets/* | Where-Object { $_.Extension -in '.exe','.msi' }
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii release-assets/SHA256SUMS-windows-${{ matrix.target }}.txt
      - uses: softprops/action-gh-release@v3
        if: matrix.platform == 'windows-latest'
        with:
          files: release-assets/*
      - name: Package macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            target/${{ matrix.target }}/release/bundle/macos/ThermoLink.app \
            release-assets/ThermoLink-macos-${{ matrix.target }}.zip
          (cd release-assets && shasum -a 256 * > SHA256SUMS-macos-${{ matrix.target }}.txt)
      - uses: softprops/action-gh-release@v3
        if: matrix.platform == 'macos-latest'
        with:
          files: release-assets/*
